<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Tennis SillaCoach</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:white;font:16px system-ui}main{max-width:520px;margin:auto;padding:16px 16px max(16px,env(safe-area-inset-bottom))}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid #444;padding-bottom:12px}header img{width:44px}h1,h2,p{margin:0 0 12px}header h1{margin:0;font-size:1.35rem}h2{margin-top:18px}button,input,select{font:inherit;color:inherit;background:#171717;border:1px solid #777;border-radius:10px;padding:10px;min-height:48px}button{font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edff00;outline-offset:2px}.primary{background:#edff00;color:black;border:0;width:100%;min-height:64px;margin-top:10px}.row,.clocks{display:flex;gap:8px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clocks{position:sticky;top:0;background:#000;z-index:1;padding:8px 0}.clocks div{flex:1}.clocks strong{display:block;font-size:1.9rem;font-variant-numeric:tabular-nums}.card{border:1px solid #666;border-radius:12px;padding:12px;margin:8px 0}.score{text-align:center}.score strong{display:block;font-size:3rem}.score button{flex:1;font-size:1.3rem}fieldset{border:1px solid #666;border-radius:10px;margin:12px 0}label{display:block;margin:8px 0}label input[type=number],label select{display:block;width:100%;margin-top:4px}input[type=checkbox]{min-height:0;width:20px;height:20px;vertical-align:middle}.wide{width:100%;margin-top:8px}.muted{color:#c6c6c6}.orb{background:#edff00;width:96px;height:96px;border-radius:50%;margin:24px auto;animation:breathe 5s infinite}@keyframes breathe{0%,100%{transform:scale(.7)}40%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.orb{display:none;animation:none}}#breath{text-align:center}li{margin-bottom:8px}[hidden]{display:none!important}
</style></head><body><main><header><img src="./icon-192.png" alt=""><h1>Tennis SillaCoach</h1></header>
<button id="install" class="wide" hidden>Instalar en Android</button><p id="notice" role="status"></p>
<div id="clocks" class="clocks" hidden><div>PARTIDO<strong id="matchClock"></strong></div><div>DESCANSO<strong id="restClock"></strong></div></div>
<section id="setup"><h2>Antes de jugar</h2><form id="setupForm"><div class="grid"><label>Tu edad<input name="age" type="number" min="1" max="120" inputmode="numeric"></label><label>Edad del rival<input name="rivalAge" type="number" min="1" max="120" inputmode="numeric"></label></div><label>Lateralidad del rival<select name="hand"><option>Desconocida</option><option>Diestro</option><option>Zurdo</option></select></label><fieldset><legend>Objetivos del día · hasta dos</legend><label><input type="checkbox" name="goal" value="Asegurar el primer saque"> Asegurar el primer saque</label><label><input type="checkbox" name="goal" value="Jugar con margen"> Jugar con margen</label><label><input type="checkbox" name="goal" value="Elegir mejor cuándo subir a la red"> Elegir mejor cuándo subir a la red</label></fieldset><button class="primary">INICIAR PARTIDO</button></form><div id="history"></div></section>
<section id="marker" hidden><button class="wide" id="rest">INICIAR DESCANSO</button><div class="card row"><button id="prevSet" aria-label="Set anterior">−</button><strong id="setLabel"></strong><button id="nextSet" aria-label="Set siguiente">+</button></div><div class="grid" id="scores"></div><button class="wide" id="tie" aria-pressed="false">ESTOY EN TIE-BREAK</button><button class="primary" id="next">SIGUIENTE: SENSACIONES</button><button class="wide" id="finish">FINALIZAR PARTIDO</button></section>
<section id="breath" hidden><h2>PAUSA Y RESPIRA</h2><div class="orb" aria-hidden="true"></div><p id="cue"></p><p id="breathSeconds"></p><button class="primary" id="skip">SALTAR</button></section>
<section id="feel" hidden><h2>¿Cómo vas?</h2><form id="feelForm"><div class="grid"><label>Confianza<select name="confidence"><option value="">Omitir</option><option>Baja</option><option>Media</option><option>Alta</option></select></label><label>Fatiga<select name="fatigue"><option value="">Omitir</option><option>Baja</option><option>Media</option><option>Alta</option></select></label></div><details id="optional"><summary>Agregar una observación</summary><div class="grid"><label>Jugador<select name="who"><option>Yo</option><option>Rival</option></select></label><label>Golpe<select name="shot"><option>Saque</option><option>Golpes ganadores</option><option>Red</option><option>Revés</option><option>Paralelo</option></select></label></div><label>Cómo está funcionando<select name="quality"><option value="">Sin observar</option><option>Consistente</option><option>Inconsistente</option><option>Ganando puntos</option><option>Fallando</option></select></label><label id="sideLabel" hidden>Lado de origen mirando la red<select name="side"><option value="">Sin indicar</option><option>Izquierda</option><option>Derecha</option></select></label></details><button class="primary">VER CONSIGNA</button></form><button class="wide" data-marker>VOLVER AL MARCADOR</button></section>
<section id="advice" hidden><h2>Próximos dos games</h2><div class="card"><strong id="mainTip"></strong><p class="muted" id="otherTip"></p></div><button class="primary" data-marker>VOLVER AL MARCADOR</button></section>
<section id="close" hidden><h2>Finalizar partido</h2><form id="closeForm"><label>Resultado<select name="result"><option>Sin indicar</option><option>Ganado</option><option>Perdido</option><option>Inconcluso</option></select></label><div id="assessment"></div><button class="primary">CONFIRMAR Y VER INFORME</button></form><button class="wide" data-marker>VOLVER AL MARCADOR</button></section>
<section id="report" hidden><h2>Informe del partido</h2><div id="reportBody"></div><button class="primary" id="newMatch">VOLVER AL INICIO</button></section>
</main><script>
'use strict';
const get = id => document.getElementById(id);
const key = 'sillacoach-completa-v1';
const screens = ['setup','marker','breath','feel','advice','close','report'];
let data = {active:null, history:[]};
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (saved && Array.isArray(saved.history)) data = saved;
} catch { get('notice').textContent = 'Se abrió una sesión nueva.'; }
const active = () => data.active;
const score = () => active().sets[active().set];
const elapsed = (match, now = Date.now()) => Math.max(0,(match.end ?? now)-match.start);
function save() {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch { get('notice').textContent = 'El navegador no pudo guardar los datos.'; }
}
function show(id) {
  for (const screen of screens) get(screen).hidden = screen !== id;
  get('clocks').hidden = !active() || id === 'setup' || id === 'report';
}
function clock(ms, total = false) {
  const s = Math.max(0,total ? Math.floor(ms/1000) : Math.ceil(ms/1000));
  const two = n => String(n).padStart(2,'0');
  return total ? two(Math.floor(s/3600))+':'+two(Math.floor(s/60)%60)+':'+two(s%60)
    : Math.floor(s/60)+':'+two(s%60);
}
function tick(now = Date.now()) {
  const match = active();
  if (!match) return;
  get('matchClock').textContent = clock(elapsed(match,now),true);
  const remaining = match.restEnd === null ? 90000 : match.restEnd-now;
  get('restClock').textContent = clock(remaining);
  get('rest').textContent = match.restEnd !== null && remaining > 0 ? 'REINICIAR DESCANSO' : 'INICIAR DESCANSO';
  if (!get('breath').hidden) {
    const left = match.breathEnd-now;
    if (left <= 0) openFeel();
    else {
      get('cue').textContent = (now-match.breathStart)%5000 < 2000 ? 'Inhala suave' : 'Exhala lento';
      get('breathSeconds').textContent = Math.ceil(left/1000)+' s';
    }
  }
}
function renderScore() {
  const match = active();
  const current = score();
  get('setLabel').textContent = 'SET '+(match.set+1);
  get('prevSet').disabled = match.set === 0;
  get('nextSet').disabled = match.set === 2;
  const tie = current.tie || (current.me === 6 && current.rival === 6);
  get('tie').textContent = tie ? 'TIE-BREAK ACTIVO' : 'ESTOY EN TIE-BREAK';
  get('tie').setAttribute('aria-pressed', String(tie));
  get('tie').disabled = current.me === 6 && current.rival === 6;
  for (const field of ['me','rival']) {
    get(field).textContent = current[field];
    get(field+'Down').disabled = current[field] === 0;
    get(field+'Up').disabled = current[field] === 7;
  }
}
get('scores').innerHTML = [['me','YO'],['rival','RIVAL']].map(([field,label]) =>
  '<div class="card score">'+label+'<strong id="'+field+'"></strong><div class="row"><button id="'+field+'Down" aria-label="Restar game '+label+'">−</button><button id="'+field+'Up" aria-label="Sumar game '+label+'">+</button></div></div>').join('');
for (const field of ['me','rival']) {
  for (const [suffix,delta] of [['Down',-1],['Up',1]]) get(field+suffix).onclick = () => {
    score()[field] = Math.max(0,Math.min(7,score()[field]+delta));
    save(); renderScore();
  };
}
for (const [id,delta] of [['prevSet',-1],['nextSet',1]]) get(id).onclick = () => {
  active().set = Math.max(0,Math.min(2,active().set+delta));
  save(); renderScore();
};
get('tie').onclick = () => { score().tie = !score().tie; save(); renderScore(); };
get('setupForm').onchange = () => {
  const boxes = [...get('setupForm').querySelectorAll('[name=goal]')];
  const full = boxes.filter(box => box.checked).length >= 2;
  for (const box of boxes) box.disabled = full && !box.checked;
};
get('setupForm').onsubmit = event => {
  event.preventDefault();
  if (active()) return;
  const form = new FormData(event.currentTarget);
  data.active = {
    start:Date.now(), end:null, age:Number(form.get('age'))||null, rivalAge:Number(form.get('rivalAge'))||null,
    hand:form.get('hand'), goals:form.getAll('goal'), set:0, restEnd:null, offered:false,
    sets:Array.from({length:3},()=>({me:0,rival:0,tie:false})), observations:[]
  };
  save(); openMarker();
};
function openMarker() { show('marker'); renderScore(); tick(); }
get('rest').onclick = () => {
  Object.assign(active(),{restEnd:Date.now()+90000,offered:false,breathEnd:null});
  save(); tick();
};
function critical({me,rival,tie}) {
  return tie || (me===6 && rival===6) || (me<rival && (rival-me>=3 || rival===5 || (me===5 && rival===6)));
}
function openFeel() {
  active().breathEnd = null;
  get('feelForm').reset();
  get('optional').open = false;
  get('sideLabel').hidden = true;
  save(); show('feel');
}
get('next').onclick = () => {
  const match = active();
  const now = Date.now();
  const duration = Math.min(15000,match.restEnd===null ? 15000 : match.restEnd-now);
  if (!match.offered && duration>0 && critical(score())) {
    Object.assign(match,{offered:true,breathStart:now,breathEnd:now+duration});
    save(); show('breath'); tick(now);
  } else openFeel();
};
get('skip').onclick = openFeel;
get('feelForm').onchange = () => { get('sideLabel').hidden = get('feelForm').elements.shot.value !== 'Paralelo'; };
for (const button of document.querySelectorAll('[data-marker]')) button.onclick = openMarker;
const positive = quality => ['Consistente','Ganando puntos'].includes(quality);
const negative = quality => ['Inconsistente','Fallando'].includes(quality);
function serve(hand) {
  if (hand==='Diestro') return 'Busca su revés con el saque: a la T desde iguales y abierto desde ventaja.';
  if (hand==='Zurdo') return 'Busca su revés con el saque: abierto desde iguales y a la T desde ventaja.';
  return 'Saca con margen y observa desde qué lado devuelve más corto.';
}
const fixes = {
  Saque:'Apunta a una zona amplia del cuadro y conserva el mismo ritmo de lanzamiento.',
  'Golpes ganadores':'Construye el punto cruzado y acelera con una pelota corta y equilibrado.',
  Red:'Sube tras una pelota corta y dirige la primera volea a una zona amplia.',
  'Revés':'Juega el revés cruzado con altura y margen sobre la red.',
  Paralelo:'Cambia al paralelo solo cuando estés equilibrado y tengas una pelota cómoda.'
};
const drills = {
  Saque:'Haz 3 series de 10 primeros saques. Meta: 7 dentro en cada serie.',
  'Golpes ganadores':'Juega 10 secuencias de cruzado y definición tras pelota corta. Meta: 7 definiciones dentro.',
  Red:'Practica 12 aproximaciones seguidas de volea. Meta: colocar 8 primeras voleas dentro.',
  'Revés':'Practica 3 series de 10 reveses cruzados. Meta: 8 dentro por serie.',
  Paralelo:'Golpea 10 paralelos tras pelota cómoda. Meta: 7 dentro con margen lateral.'
};
function tactical(match, observation, ms) {
  const long = ms >= 75*60000;
  const tired = ['Media','Alta'].includes(observation.fatigue);
  const previous = [...match.observations].reverse().find(item => item.quality);
  const observed = observation.quality ? observation : previous;
  const calm = 'Antes de sacar, exhala y elige un solo objetivo.';
  if (tired) return long
    ? ['Simplifica: juega cruzado con margen. Acorta el punto cuando recibas una pelota corta y puedas tomar la iniciativa.', fixes.Red]
    : ['Juega cruzado con altura. Cambia de dirección solo con una pelota cómoda.', calm];
  if (observed?.who==='Rival' && observed.shot==='Revés' && negative(observed.quality)) return [serve(match.hand),'Si devuelve corto, busca una zona amplia para el siguiente golpe.'];
  if (observed?.who==='Yo' && negative(observed.quality)) return [fixes[observed.shot],calm];
  if (observed?.who==='Yo' && positive(observed.quality)) {
    if (observed.shot==='Paralelo' && observed.side && match.hand!=='Desconocida') {
      const wing = (observed.side==='Izquierda')===(match.hand==='Diestro') ? 'derecha' : 'revés';
      return ['Mantén el paralelo desde tu '+observed.side.toLowerCase()+' cuando tengas una pelota cómoda. Si el rival está centrado, va hacia su '+wing+'.', fixes.Paralelo];
    }
    return ['Mantén el patrón que te funciona en '+observed.shot.toLowerCase()+'. '+fixes[observed.shot],long && !observation.fatigue ? 'En el próximo cambio, registra cómo te sientes.' : calm];
  }
  if (observed?.who==='Rival' && positive(observed.quality) && observed.shot==='Red') return ['Cuando el rival suba, juega bajo a sus pies o usa un globo si queda cerca de la red.',calm];
  if (observed?.who==='Rival' && positive(observed.quality) && observed.shot==='Saque') return ['Bloquea la devolución profunda al centro para neutralizar el saque.',calm];
  if (observation.confidence==='Baja' || critical(match.sets[match.set])) return ['Asegura el primer saque con margen y juega la siguiente pelota cruzada.',calm];
  if (match.goals.includes('Elegir mejor cuándo subir a la red')) return [fixes.Red,calm];
  if (match.goals.includes('Asegurar el primer saque')) return [fixes.Saque,calm];
  return ['Juega cruzado con margen y cambia de dirección con una pelota cómoda.',long && !observation.fatigue ? 'En el próximo cambio, registra cómo te sientes.' : calm];
}
get('feelForm').onsubmit = event => {
  event.preventDefault();
  const match = active();
  const ms = elapsed(match);
  const fields = Object.fromEntries(new FormData(event.currentTarget));
  const observation = {...fields,minute:Math.floor(ms/60000),set:match.set+1,score:[score().me,score().rival]};
  const [tip,alternative] = tactical(match,observation,ms);
  if (observation.quality || observation.fatigue || observation.confidence) match.observations.push(observation);
  save();
  get('mainTip').textContent = tip;
  get('otherTip').textContent = alternative;
  show('advice');
};
get('finish').onclick = () => {
  get('closeForm').reset();
  const assessment = get('assessment');
  assessment.replaceChildren();
  active().goals.forEach((goal,index) => {
    const label = document.createElement('label');
    label.textContent = goal;
    const select = document.createElement('select');
    select.name = 'goal'+index;
    for (const value of ['Sin evidencia suficiente','Cumplido','Parcial','No cumplido']) select.add(new Option(value));
    label.append(select);
    assessment.append(label);
  });
  show('close');
};
get('closeForm').onsubmit = event => {
  event.preventDefault();
  const match = active();
  if (!match) return;
  const form = new FormData(event.currentTarget);
  match.end = Date.now();
  match.result = form.get('result');
  match.assessment = match.goals.map((goal,index)=>[goal,form.get('goal'+index)]);
  data.history.unshift(match);
  data.active = null;
  save(); report(match);
};
function report(match) {
  const body = get('reportBody');
  body.replaceChildren();
  function section(title, lines) {
    const card = document.createElement('section');
    card.className = 'card';
    const heading = document.createElement('h3');
    heading.textContent = title;
    const list = document.createElement('ul');
    for (const line of lines) {
      const item = document.createElement('li');
      item.textContent = line;
      list.append(item);
    }
    card.append(heading,list);
    body.append(card);
  }
  const sets = match.sets.slice(0,Math.max(match.set+1,match.sets[2].me||match.sets[2].rival?3:match.sets[1].me||match.sets[1].rival?2:1));
  section('Resultado y duración',[match.result+' · '+sets.map(set=>set.me+'–'+set.rival).join(' / ')+' · '+clock(elapsed(match),true)]);
  const context = [];
  if (match.hand !== 'Desconocida') context.push('Rival '+match.hand.toLowerCase()+'.');
  if (match.age && match.rivalAge) context.push('Edades registradas: '+match.age+' y '+match.rivalAge+' años.');
  const observations = match.observations;
  for (const [label,test] of [['Antes de 75 min',minute=>minute<75],['Desde 75 min',minute=>minute>=75]]) {
    const entries = observations.filter(item=>test(item.minute));
    if (!entries.length) continue;
    context.push(label);
    for (const item of entries) {
      const values = [];
      if (item.quality) values.push(item.who+' · '+item.shot+' · '+item.quality);
      if (item.fatigue) values.push('Fatiga '+item.fatigue.toLowerCase());
      if (item.confidence) values.push('Confianza '+item.confidence.toLowerCase());
      context.push('Min '+item.minute+' · set '+item.set+' ('+item.score.join('–')+') · '+values.join(' · '));
    }
  }
  if (!observations.length) context.push('Sin observaciones durante el partido.');
  section('Diagnóstico por tramos',context);
  section('Objetivos',match.assessment.length ? match.assessment.map(([goal,value])=>goal+' — '+value+' (autoevaluación)') : ['Sin objetivos seleccionados.']);
  const priorities = [...new Set(observations.filter(item=>item.who==='Yo' && negative(item.quality)).reverse().map(item=>item.shot))].slice(0,3);
  const training = priorities.length ? priorities : ['Saque','Revés'];
  section('Ajustes de juego',training.map(shot=>fixes[shot]));
  section('Entrenamiento semanal',training.map(shot=>drills[shot]));
  show('report');
}
function home() {
  const history = get('history');
  history.replaceChildren();
  if (data.history.length) {
    const heading = document.createElement('h2');
    heading.textContent = 'Partidos anteriores';
    history.append(heading);
  }
  for (const match of data.history) {
    const button = document.createElement('button');
    button.className = 'wide';
    button.textContent = new Date(match.start).toLocaleString('es-CL')+' · '+match.result+' · '+clock(elapsed(match),true);
    button.onclick = () => report(match);
    history.append(button);
  }
  show('setup');
}
get('newMatch').onclick = home;
if (active()) {
  openMarker();
  if (active().breathEnd > Date.now()) { show('breath'); tick(); }
} else home();
setInterval(()=>tick(),250);
document.addEventListener('visibilitychange',()=>tick());
window.addEventListener('pageshow',()=>tick());
let installPrompt;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault(); installPrompt=event; get('install').hidden=false;
});
get('install').onclick=async()=>{
  if (!installPrompt) return;
  await installPrompt.prompt();
  installPrompt=null;
  get('install').hidden=true;
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{
  get('notice').textContent='La apertura sin conexión no está disponible en esta sesión.';
});
</script></body></html>
