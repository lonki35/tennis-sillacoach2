<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:white;font:16px system-ui}main{max-width:520px;margin:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid #444;padding-bottom:12px}header img{width:44px}h1,h2,p{margin:0 0 12px}header h1{margin:0;font-size:1.35rem}h2{margin-top:18px}button,input,select{font:inherit;color:inherit;background:#171717;border:1px solid #777;border-radius:10px;padding:10px;min-height:48px}button{font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edff00;outline-offset:2px}.primary{background:#edff00;color:black;border:0;width:100%;min-height:64px;margin-top:10px}.row,.clocks{display:flex;gap:8px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clocks{position:sticky;top:0;background:#000;z-index:1;padding:8px 0}.clocks div{flex:1}.clocks strong{display:block;font-size:1.9rem;font-variant-numeric:tabular-nums}.card{border:1px solid #666;border-radius:12px;padding:12px;margin:8px 0}.score{text-align:center}.score strong{display:block;font-size:3rem}.score button{flex:1;font-size:1.3rem}fieldset{border:1px solid #666;border-radius:10px;margin:12px 0}label{display:block;margin:8px 0}label input[type=number],label select{display:block;width:100%;margin-top:4px}input[type=checkbox]{min-height:0;width:20px;height:20px;vertical-align:middle}.wide{width:100%;margin-top:8px}.muted{color:#c6c6c6}.orb{background:#edff00;width:96px;height:96px;border-radius:50%;margin:24px auto;animation:breathe 5s infinite}@keyframes breathe{0%,100%{transform:scale(.7)}40%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.orb{display:none;animation:none}}#breath{text-align:center}li{margin-bottom:8px}[hidden]{display:none!important}
.nav{margin:12px 0}.nav button{flex:1}.nav [aria-pressed=true]{background:#edff00;color:#000}.score button{width:100%;min-height:64px}.history-entry{text-align:left}.sets{overflow-wrap:anywhere}button,summary{min-width:48px;min-height:48px}summary{display:list-item;padding:12px 0;cursor:pointer}fieldset{min-width:0}select{max-width:100%}.profile{overflow-wrap:anywhere}.grid>*{min-width:0}</style></head><body><main><header><img src="./icon-192.png" alt=""><h1>Tennis SillaCoach</h1></header><nav class="row nav" aria-label="Secciones"><button id="tabMatch" aria-pressed="true">Partido</button><button id="tabHistory" aria-pressed="false">Historial</button></nav>
<button id="install" class="wide" hidden>Instalar en Android</button><p id="notice" role="status"></p>
<div id="clocks" class="clocks" hidden><div>PARTIDO<strong id="matchClock"></strong></div><div>DESCANSO<strong id="restClock"></strong></div></div>
<section id="setup"><h2>Antes de jugar</h2><form id="setupForm"><fieldset><legend>Datos del rival</legend>
<label>Nombre del rival<input name="rivalName" type="text" required maxlength="100" style="display:block;width:100%"></label>
<label for="rivalHand">Lateralidad del rival</label><select id="rivalHand" name="hand" style="width:100%"><option>Desconocida</option><option>Diestro</option><option>Zurdo</option></select>
<label>Edad aproximada del rival<input name="rivalAge" type="number" min="1" max="120" step="1" inputmode="numeric" placeholder="Sin informar"></label>
<label>Categoría del rival<select name="category"><option>Sin informar</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></fieldset>
<label>Mi edad<input name="age" type="number" min="1" max="120" step="1" inputmode="numeric"></label>
<label>Tipo de partido<select name="kind"><option>Amistoso</option><option>Liga</option><option>Ranking</option></select></label>
<label>Formato del tercer set<select name="format"><option value="normal">Set normal</option><option value="super">Súper tie-break a 10 puntos</option></select></label><fieldset><legend>Objetivos del día · hasta dos</legend><label><input type="checkbox" name="goal" value="Asegurar el primer saque"> Asegurar el primer saque</label><label><input type="checkbox" name="goal" value="Jugar con margen"> Jugar con margen</label><label><input type="checkbox" name="goal" value="Elegir mejor cuándo subir a la red"> Elegir mejor cuándo subir a la red</label></fieldset><button class="primary">INICIAR PARTIDO</button></form></section><section id="historyScreen" hidden><h2>Historial</h2><div id="history"></div></section>
<section id="marker" hidden><p id="matchName" class="profile"></p><details><summary>Perfil del rival</summary><p id="rivalProfile"></p></details><button class="wide" id="rest">INICIAR DESCANSO</button><p class="card sets" id="closedSets"></p><h2 id="setLabel"></h2><div class="grid" id="scores"></div><button class="wide" id="undo">DESHACER ÚLTIMO CAMBIO</button><button class="primary" id="next">SIGUIENTE: SENSACIONES</button><button class="wide" id="finish">FINALIZAR PARTIDO</button></section>
<section id="breath" hidden><h2>PAUSA Y RESPIRA</h2><div class="orb" aria-hidden="true"></div><p id="cue"></p><p id="breathSeconds"></p><button class="primary" id="skip">SALTAR</button></section>
<section id="feel" hidden><h2>¿Cómo vas?</h2><form id="feelForm"><div class="grid"><label>Confianza<select name="confidence"><option value="">Omitir</option><option>Baja</option><option>Media</option><option>Alta</option></select></label><label>Fatiga<select name="fatigue"><option value="">Omitir</option><option>Baja</option><option>Media</option><option>Alta</option></select></label></div><details id="optional"><summary>Agregar una observación</summary><div class="grid"><label>Jugador<select name="who"><option>Yo</option><option>Rival</option></select></label><label>Golpe<select name="shot"><option>Saque</option><option>Golpes ganadores</option><option>Red</option><option>Revés</option><option>Paralelo</option></select></label></div><label>Cómo está funcionando<select name="quality"><option value="">Sin observar</option><option>Consistente</option><option>Inconsistente</option><option>Ganando puntos</option><option>Fallando</option></select></label><label id="sideLabel" hidden>Lado de origen mirando la red<select name="side"><option value="">Sin indicar</option><option>Izquierda</option><option>Derecha</option></select></label></details><button class="primary">VER CONSIGNA</button></form><button class="wide" data-marker>VOLVER AL MARCADOR</button></section>
<section id="advice" hidden><h2 id="adviceHorizon">Próximos dos games</h2><p id="adviceBasis" class="muted"></p><div class="card"><strong id="mainTip"></strong><p class="muted" id="otherTip"></p></div><button class="primary" data-marker>VOLVER AL MARCADOR</button></section>
<section id="close" hidden><h2>Finalizar partido</h2><form id="closeForm"><p id="closeStatus"></p><div id="assessment"></div><button class="primary">CONFIRMAR Y VER INFORME</button></form><button class="wide" data-marker>VOLVER AL MARCADOR</button></section>
<section id="report" hidden><h2>Informe del partido</h2><div id="reportBody"></div><button class="primary" id="newMatch">VOLVER AL INICIO</button></section>
</main><script src="./score.js"></script><script>
'use strict';
const get = id => document.getElementById(id);
const key = 'sillacoach-completa-v1';
const screens = ['setup','marker','breath','feel','advice','close','report','historyScreen'];
let data = {version:2,active:null,history:[],next:1};
try {
  const saved = JSON.parse(localStorage.getItem(key));
  if (saved && Array.isArray(saved.history)) { data = SillaScore.migrate(saved); if (saved.version!==2) save(); }
} catch { get('notice').textContent = 'Se abrió una sesión nueva.'; }
const active = () => data.active;
const score = () => active().sets[active().set];
const elapsed = (match, now = Date.now()) => Math.max(0,(match.end ?? now)-match.start);
function save() {
  try { localStorage.setItem(key, JSON.stringify(data)); return true; }
  catch { get('notice').textContent = 'El navegador no pudo guardar los datos. Puedes volver a intentar.'; }
}
function show(id) {
  for (const screen of screens) get(screen).hidden = screen !== id;
  const history = id === 'historyScreen' || id === 'report';
  get('tabMatch').setAttribute('aria-pressed',String(!history));
  get('tabHistory').setAttribute('aria-pressed',String(history));
  get('clocks').hidden = !active() || history || id === 'setup';
}
function clock(ms, total = false) {
  const s = Math.max(0,total ? Math.floor(ms/1000) : Math.ceil(ms/1000));
  const two = n => String(n).padStart(2,'0');
  return total ? two(Math.floor(s/3600))+':'+two(Math.floor(s/60)%60)+':'+two(s%60)
    : Math.floor(s/60)+':'+two(s%60);
}
function tick(now = Date.now()) {
  const match = active();
  if (!match) return;
  get('matchClock').textContent = clock(elapsed(match,now),true);
  const remaining = match.restEnd === null ? 90000 : match.restEnd-now;
  get('restClock').textContent = clock(remaining);
  get('rest').textContent = match.restEnd !== null && remaining > 0 ? 'REINICIAR DESCANSO' : 'INICIAR DESCANSO';
  if (!get('breath').hidden) {
    const left = match.breathEnd-now;
    if (left <= 0) openFeel();
    else {
      get('cue').textContent = (now-match.breathStart)%5000 < 2000 ? 'Inhala suave' : 'Exhala lento';
      get('breathSeconds').textContent = Math.ceil(left/1000)+' s';
    }
  }
}

function renderScore() {
  const match = active();
  const current = score();
  const points = current.super || !!current.points;
  const completed = match.end!==null;
  get('rivalProfile').textContent = rivalProfile(match);
  const finished = match.sets.map((set,index)=>SillaScore.winner(set)?'Set '+(index+1)+' · '+SillaScore.label(set):'').filter(Boolean);
  get('matchName').textContent = 'Partido N.º '+match.number+' · '+(match.rivalName||'Rival sin informar');
  get('closedSets').textContent = 'Sets jugados · '+(finished.join(' / ')||'Ninguno terminado');
  get('setLabel').textContent = completed ? 'Partido terminado' : 'Set '+(match.set+1)+(current.super?' · Súper tie-break':points?' · Tie-break':' · Games');
  get('undo').disabled = !match.undo;
  get('rest').hidden = completed;
  get('next').hidden = completed;
  get('finish').textContent = completed?'CONFIRMAR RESULTADO Y VER INFORME':'CERRAR COMO INCONCLUSO';
  get('finish').classList.toggle('primary',completed);
  for (const field of ['me','rival']) {
    get(field).textContent = (current.points??current)[field];
    const button = get(field+'Up');
    button.disabled = completed || !!match.legacyManual;
    button.textContent = points?'+ Punto':'+ Game';
    button.setAttribute('aria-label','Sumar '+(points?'punto':'game')+' a '+(field==='me'?'YO':'RIVAL'));
  }
}
get('scores').innerHTML = [['me','YO'],['rival','RIVAL']].map(([field,label]) =>
  '<div class="card score">'+label+'<strong id="'+field+'"></strong><button id="'+field+'Up">+</button></div>').join('');
for (const field of ['me','rival']) get(field+'Up').onclick = () => {
  SillaScore.add(active(),field,Date.now());
  save(); renderScore(); tick();
};
get('undo').onclick = () => {
  SillaScore.undo(active());
  save(); renderScore(); tick();
};
get('setupForm').onchange = () => {
  const boxes = [...get('setupForm').querySelectorAll('[name=goal]')];
  const full = boxes.filter(box => box.checked).length >= 2;
  for (const box of boxes) box.disabled = full && !box.checked;
};
get('setupForm').onsubmit = event => {
  event.preventDefault();
  if (active()) return;
  const form = new FormData(event.currentTarget);
  const rivalName = form.get('rivalName').trim();
  if (!rivalName) { get('notice').textContent='Escribe el nombre del rival.'; event.currentTarget.elements.rivalName.focus(); return; }
  get('notice').textContent='';
  data.active = {
    number:data.next++,rivalName,category:form.get('category'),kind:form.get('kind'),format:form.get('format'),undo:null,
    start:Date.now(), end:null, age:Number(form.get('age'))||null, rivalAge:Number(form.get('rivalAge'))||null,
    hand:form.get('hand'), goals:form.getAll('goal'), set:0, restEnd:null, offered:false,
    sets:[{me:0,rival:0}], observations:[]
  };
  save(); openMarker();
};
function openMarker() {
  show('marker'); renderScore();
  if (active().breathEnd > Date.now()) show('breath');
  tick();
  if (active().legacyManual) get('notice').textContent='El marcador manual anterior tiene un resultado fuera del formato automático. Puedes guardarlo como inconcluso.';
}
get('rest').onclick = () => {
  Object.assign(active(),{restEnd:Date.now()+90000,offered:false,breathEnd:null});
  save(); tick();
};
function critical({me,rival,tie,points,super:isSuper}) {
  return !!points || isSuper || tie || (me===6 && rival===6) || (me<rival && (rival-me>=3 || rival===5 || (me===5 && rival===6)));
}
function openFeel() {
  active().breathEnd = null;
  get('feelForm').reset();
  get('optional').open = false;
  get('sideLabel').hidden = true;
  save(); show('feel');
}
get('next').onclick = () => {
  const match = active();
  const now = Date.now();
  const duration = Math.min(15000,match.restEnd===null ? 15000 : match.restEnd-now);
  if (match.restEnd!==null && !match.offered && duration>0 && critical(score())) {
    Object.assign(match,{offered:true,breathStart:now,breathEnd:now+duration});
    save(); show('breath'); tick(now);
  } else openFeel();
};
get('skip').onclick = openFeel;
get('feelForm').onchange = () => { get('sideLabel').hidden = get('feelForm').elements.shot.value !== 'Paralelo'; };
for (const button of document.querySelectorAll('[data-marker]')) button.onclick = openMarker;
const positive = quality => ['Consistente','Ganando puntos'].includes(quality);
const negative = quality => ['Inconsistente','Fallando'].includes(quality);
function serve(hand) {
  if (hand==='Diestro') return 'Busca su revés con el saque: a la T desde iguales y abierto desde ventaja.';
  if (hand==='Zurdo') return 'Busca su revés con el saque: abierto desde iguales y a la T desde ventaja.';
  return 'Saca con margen y observa desde qué lado devuelve más corto.';
}
const fixes = {
  Saque:'Apunta a una zona amplia del cuadro y conserva el mismo ritmo de lanzamiento.',
  'Golpes ganadores':'Construye el punto cruzado y acelera con una pelota corta y equilibrado.',
  Red:'Sube tras una pelota corta y dirige la primera volea a una zona amplia.',
  'Revés':'Juega el revés cruzado con altura y margen sobre la red.',
  Paralelo:'Cambia al paralelo solo cuando estés equilibrado y tengas una pelota cómoda.'
};
const drills = {
  Saque:'Haz 3 series de 10 primeros saques. Meta: 7 dentro en cada serie.',
  'Golpes ganadores':'Juega 10 secuencias de cruzado y definición tras pelota corta. Meta: 7 definiciones dentro.',
  Red:'Practica 12 aproximaciones seguidas de volea. Meta: colocar 8 primeras voleas dentro.',
  'Revés':'Practica 3 series de 10 reveses cruzados. Meta: 8 dentro por serie.',
  Paralelo:'Golpea 10 paralelos tras pelota cómoda. Meta: 7 dentro con margen lateral.'
};
function tactical(match, observation, ms) {
  const long = ms >= 75*60000;
  const tired = ['Media','Alta'].includes(observation.fatigue);
  const previous = [...match.observations].reverse().find(item => item.quality);
  const observed = observation.quality ? observation : previous;
  const calm = 'Antes de sacar, exhala y elige un solo objetivo.';
  if (tired) return long
    ? ['Simplifica: juega cruzado con margen. Acorta el punto cuando recibas una pelota corta y puedas tomar la iniciativa.', fixes.Red]
    : ['Juega cruzado con altura. Cambia de dirección solo con una pelota cómoda.', calm];
  if (observed?.who==='Rival' && observed.shot==='Revés' && negative(observed.quality)) return [serve(match.hand),'Si devuelve corto, busca una zona amplia para el siguiente golpe.'];
  if (observed?.who==='Yo' && negative(observed.quality)) return [fixes[observed.shot],calm];
  if (observed?.who==='Yo' && positive(observed.quality)) {
    if (observed.shot==='Paralelo' && observed.side && match.hand!=='Desconocida') {
      const wing = (observed.side==='Izquierda')===(match.hand==='Diestro') ? 'derecha' : 'revés';
      return ['Mantén el paralelo desde tu '+observed.side.toLowerCase()+' cuando tengas una pelota cómoda. Si el rival está centrado, va hacia su '+wing+'.', fixes.Paralelo];
    }
    return ['Mantén el patrón que te funciona en '+observed.shot.toLowerCase()+'. '+fixes[observed.shot],long && !observation.fatigue ? 'En el próximo cambio, registra cómo te sientes.' : calm];
  }
  if (observed?.who==='Rival' && observed.shot==='Saque' && negative(observed.quality)) return ['En el segundo saque rival, devuelve profundo con margen. Avanza si la siguiente pelota queda corta.',calm];
  if (observed?.who==='Rival' && positive(observed.quality) && observed.shot==='Red') return ['Cuando el rival suba, juega bajo a sus pies o usa un globo si queda cerca de la red.',calm];
  if (observed?.who==='Rival' && positive(observed.quality) && observed.shot==='Saque') return ['Bloquea la devolución profunda al centro para neutralizar el saque.',calm];
  if (observation.confidence==='Baja' || critical(match.sets[match.set])) return ['Asegura el primer saque con margen y juega la siguiente pelota cruzada.',calm];
  if (match.goals.includes('Elegir mejor cuándo subir a la red')) return [fixes.Red,calm];
  if (match.goals.includes('Asegurar el primer saque')) return [fixes.Saque,calm];
  return ['Sin un patrón observado, juega cruzado con margen y cambia de dirección con una pelota cómoda.',long && !observation.fatigue ? 'En el próximo cambio, registra cómo te sientes.' : calm];
}
get('feelForm').onsubmit = event => {
  event.preventDefault();
  const match = active();
  const ms = elapsed(match);
  const fields = Object.fromEntries(new FormData(event.currentTarget));
  const observation = {...fields,unit:score().points||score().super?'puntos':'games',minute:Math.floor(ms/60000),set:match.set+1,score:[(score().points??score()).me,(score().points??score()).rival],scoreLabel:SillaScore.label(score())};
  const [tip,alternative] = tactical(match,observation,ms);
  const previous = [...match.observations].reverse().find(item=>item.quality);
  const source = observation.quality ? observation : previous;
  const basis = observation.fatigue && observation.fatigue!=='Baja' ? 'Fatiga '+observation.fatigue.toLowerCase() : source ? source.who+' · '+source.shot+' · '+source.quality : 'Marcador, sensaciones y objetivos disponibles';
  (match.recommendations ??= []).push({minute:observation.minute,set:observation.set,tip,alternative,basis,source:source??null});
  if (observation.quality || observation.fatigue || observation.confidence) match.observations.push(observation);
  get('adviceHorizon').textContent = observation.unit==='puntos'?'Próximos puntos':'Próximos dos games';
  get('adviceBasis').textContent = basis;
  save();
  get('mainTip').textContent = tip;
  get('otherTip').textContent = alternative;
  show('advice');
};
get('finish').onclick = () => {
  get('closeForm').reset();
  get('closeStatus').textContent = active().end===null ? 'Guardar como inconcluso con el marcador actual.' : 'Confirma el resultado registrado.';
  const assessment = get('assessment');
  assessment.replaceChildren();
  active().goals.forEach((goal,index) => {
    const label = document.createElement('label');
    label.textContent = goal;
    const select = document.createElement('select');
    select.name = 'goal'+index;
    for (const value of ['Sin evidencia suficiente','Cumplido','Parcial','No cumplido']) select.add(new Option(value));
    label.append(select);
    assessment.append(label);
  });
  show('close');
};
get('closeForm').onsubmit = event => {
  event.preventDefault();
  const match = active();
  if (!match) return;
  const form = new FormData(event.currentTarget);
  const finished = {...match};
  SillaScore.close(finished,Date.now());
  finished.assessment = match.goals.map((goal,index)=>[goal,form.get('goal'+index)]);
  const previous = data;
  data = {...data,active:null,history:[finished,...data.history.filter(item=>item.number!==finished.number)]};
  if (!save()) { data=previous; return; } get('setupForm').reset(); get('setupForm').onchange(); get('notice').textContent=''; report(finished);
};
function report(match) {
  const body = get('reportBody');
  body.replaceChildren();
  function section(title, lines) {
    const card = document.createElement('section');
    card.className = 'card';
    const heading = document.createElement('h3');
    heading.textContent = title;
    const list = document.createElement('ul');
    for (const line of lines) {
      const item = document.createElement('li');
      item.textContent = line;
      list.append(item);
    }
    card.append(heading,list);
    body.append(card);
  }
  section('Resultado y duración',[
    summary(match),
    rivalProfile(match),
    'Duración '+clock(elapsed(match),true),
    'Formato del tercero · '+(match.format==='super'?'Súper tie-break a 10 puntos':match.format==='normal'?'Set normal':'Sin informar')
  ]);
  const context = [];
  if (match.age) context.push('Mi edad · '+match.age+' años.');
  if (match.age && match.rivalAge) context.push('Edades registradas: '+match.age+' y '+match.rivalAge+' años.');
  const observations = match.observations ?? [];
  for (const [label,test] of [['Antes de 75 min',minute=>minute<75],['Desde 75 min',minute=>minute>=75]]) {
    const entries = observations.filter(item=>test(item.minute));
    if (!entries.length) continue;
    context.push(label);
    for (const item of entries) {
      const values = [];
      if (item.quality) values.push(item.who+' · '+item.shot+' · '+item.quality);
      if (item.fatigue) values.push('Fatiga '+item.fatigue.toLowerCase());
      if (item.confidence) values.push('Confianza '+item.confidence.toLowerCase());
      context.push('Min '+item.minute+' · set '+item.set+' ('+(item.scoreLabel??item.score.join('–'))+') · '+values.join(' · '));
    }
  }
  if (!observations.length) context.push('Sin observaciones durante el partido.');
  section('Diagnóstico por tramos',context);
  section('Objetivos',match.assessment?.length ? match.assessment.map(([goal,value])=>goal+' — '+value+' (autoevaluación)') : ['Sin objetivos seleccionados.']);
  const priorities = [...new Set(observations.filter(item=>item.who==='Yo' && negative(item.quality)).reverse().map(item=>item.shot))].slice(0,3);
  const training = priorities.length ? priorities : ['Saque','Revés'];
  section('Ajustes de juego',training.map(shot=>fixes[shot]));
  section('Entrenamiento semanal',training.map(shot=>drills[shot]));
  show('report');
}

function rivalProfile(match) {
  return 'Lateralidad · '+(match.hand||'Desconocida')+' | Edad aproximada · '+(match.rivalAge?match.rivalAge+' años':'Sin informar')+' | Categoría · '+(match.category||'Sin informar');
}
function summary(match) {
  const sets = SillaScore.played(match).map(SillaScore.label).join(' / ');
  return 'N.º '+match.number+' · '+new Date(match.start).toLocaleDateString('es-CL')+
    ' · '+(match.rivalName||'Rival sin informar')+' · Categoría '+(match.category||'Sin informar')+
    ' · '+(match.kind||'Sin informar')+' · '+(match.result||'Sin informar')+' · '+(sets||'Sin marcador');
}
function home() { if (active()) openMarker(); else show('setup'); }
function openHistory() {
  const history = get('history');
  history.replaceChildren();
  if (!data.history.length) history.textContent = 'Todavía no hay partidos guardados.';
  for (const match of [...data.history].sort((a,b)=>b.number-a.number)) {
    const button = document.createElement('button');
    button.className = 'wide history-entry';
    button.textContent = summary(match);
    button.onclick = () => report(match);
    history.append(button);
  }
  show('historyScreen');
}
get('newMatch').textContent = 'VOLVER AL HISTORIAL';
get('newMatch').onclick = openHistory;
get('tabMatch').onclick = home;
get('tabHistory').onclick = openHistory;
if (active()) {
  openMarker();

} else home();
setInterval(()=>tick(),250);
document.addEventListener('visibilitychange',()=>tick());
window.addEventListener('pageshow',()=>tick());
let installPrompt;
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault(); installPrompt=event; get('install').hidden=false;
});
get('install').onclick=async()=>{
  if (!installPrompt) return;
  await installPrompt.prompt();
  installPrompt=null;
  get('install').hidden=true;
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{
  get('notice').textContent='La apertura sin conexión no está disponible en esta sesión.';
});
